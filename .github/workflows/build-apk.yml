name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK Licenses & Install Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Transcript v1.0.0 (Latest APK Build)"
          body: |
            ### 🚀 Transcript v1.0.0 — Real-Time Cross-App Translator

            **Real-time on-device audio & screen translation for Android with sub-300ms latency and ultra-low battery drain.**

            #### 📱 Direct APK Download:
            Download **`app-debug.apk`** below and install directly onto your Android device!

            #### ✨ Key Features:
            - **Edge AI Speech-to-Text:** Quantized Whisper INT8 accelerated via NNAPI / GPU delegates.
            - **Zero-Battery Silence Gating:** Silero VAD gatekeeper suppresses silence and instrumental music (0% CPU when idle).
            - **Zero-OCR Native Screen Translation:** Direct Android `AccessibilityNodeInfo` tree extraction without heavy screenshot processing.
            - **20+ Languages:** Powered by Google ML Kit On-Device Translation (100% offline, zero cloud API fees).
            - **Minimalist Floating HUD:** Jetpack Compose draggable edge-docking pill overlay.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
